<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VoltGrid Mobile Optimized</title>
  <style>
    :root {
      --bg: #050510;
      --fg: #d7f7ff;
      --cyan: #00f6ff;
      --magenta: #ff40ff;
      --danger: #ff3b64;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
    #app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    #hud {
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .4rem .9rem;
      padding: .6rem .8rem;
      background: linear-gradient(180deg, rgba(9,13,31,.95), rgba(9,13,31,.6));
      border-bottom: 1px solid rgba(0,246,255,.25);
      user-select: none;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(0,246,255,.45);
    }
    #hud .spacer { margin-left: auto; }
    #timer {
      font-size: clamp(1.1rem, 2.6vw, 1.65rem);
      color: #ffe8ef;
      text-shadow: 0 0 16px rgba(255,59,100,.95);
      min-width: 6.2rem;
      text-align: right;
    }

    #arena {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: none;
    }

    #viewport {
      position: relative;
      width: 800px;
      height: 800px;
      transform-origin: center center;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: auto;
      touch-action: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 800;
      color: #fff;
      font-size: clamp(1rem, 2.2vw, 1.7rem);
      text-shadow: 0 0 14px rgba(255,64,255,.95);
      z-index: 20;
    }

    #joy {
      position: absolute;
      width: 130px;
      height: 130px;
      margin-left: -65px;
      margin-top: -65px;
      border-radius: 50%;
      border: 2px solid rgba(0,246,255,.5);
      background: rgba(0,246,255,.09);
      display: none;
      pointer-events: none;
      z-index: 25;
      box-shadow: 0 0 14px rgba(0,246,255,.25);
    }
    #joy::after {
      content: "";
      position: absolute;
      inset: 41px;
      border-radius: 50%;
      background: rgba(0,246,255,.62);
      transform: translate(var(--jx, 0px), var(--jy, 0px));
      box-shadow: 0 0 16px rgba(0,246,255,.9);
    }
  </style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="level"></span>
    <span id="claimed"></span>
    <span id="score"></span>
    <span id="high"></span>
    <span class="spacer"></span>
    <span id="timer"></span>
  </div>

  <div id="arena">
    <div id="viewport">
      <canvas id="staticLayer" width="800" height="800" aria-label="VoltGrid static board"></canvas>
      <canvas id="dynamicLayer" width="800" height="800" aria-label="VoltGrid dynamic board"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="joy"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const L = 800;
  const CELL = 8;
  const GW = L / CELL;
  const GH = L / CELL;
  const GRID_SIZE = GW * GH;

  const VOID = 0;
  const CLAIMED = 1;
  const TRAIL = 2;

  const PLAYER_SPEED = 200; // logical px/sec
  const BASE_ORBS = 2;
  const BASE_ORB_SPEED = 125;
  const ORB_SPEED_STEP = 16; // linear ramp

  const MAX_PARTICLES = 50;
  const DEAD_ZONE = 0.18;
  const JOY_RADIUS = 44;

  const el = {
    arena: document.getElementById('arena'),
    viewport: document.getElementById('viewport'),
    staticCanvas: document.getElementById('staticLayer'),
    dynCanvas: document.getElementById('dynamicLayer'),
    overlay: document.getElementById('overlay'),
    joy: document.getElementById('joy'),
    hud: {
      level: document.getElementById('level'),
      claimed: document.getElementById('claimed'),
      score: document.getElementById('score'),
      high: document.getElementById('high'),
      timer: document.getElementById('timer')
    }
  };

  const sctx = el.staticCanvas.getContext('2d', { alpha: false });
  const dctx = el.dynCanvas.getContext('2d');

  const state = {
    grid: new Uint8Array(GRID_SIZE),
    trail: [],
    trailSet: new Set(),
    redrawStatic: true,
    player: { x: CELL * 2.5, y: CELL * 2.5, dirX: 0, dirY: 0, inVoid: false },
    orbs: [],
    particles: [],
    shakeAmp: 0,
    shock: null,
    shockTimer: 0,
    score: 0,
    high: Number(localStorage.getItem('voltgrid-highscore') || 0),
    level: 1,
    gameOver: false
  };

  const input = {
    up: false, down: false, left: false, right: false,
    joyX: 0, joyY: 0,
    touchId: null, cx: 0, cy: 0
  };

  function idx(x, y) { return y * GW + x; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function cellOf(x, y) {
    return {
      x: clamp((x / CELL) | 0, 0, GW - 1),
      y: clamp((y / CELL) | 0, 0, GH - 1)
    };
  }

  function initGrid() {
    state.grid.fill(VOID);
    for (let x = 0; x < GW; x++) {
      state.grid[idx(x, 0)] = CLAIMED;
      state.grid[idx(x, GH - 1)] = CLAIMED;
    }
    for (let y = 0; y < GH; y++) {
      state.grid[idx(0, y)] = CLAIMED;
      state.grid[idx(GW - 1, y)] = CLAIMED;
    }
    state.redrawStatic = true;
  }

  function levelOrbCount(level) {
    return BASE_ORBS + (level - 1); // linear
  }

  function levelOrbSpeed(level) {
    return BASE_ORB_SPEED + (level - 1) * ORB_SPEED_STEP; // linear
  }

  function levelGoal(level) {
    return Math.min(0.9, 0.72 + (level - 1) * 0.035); // linear progression cap
  }

  function spawnOrb(speed) {
    for (let i = 0; i < 120; i++) {
      const x = 40 + Math.random() * (L - 80);
      const y = 40 + Math.random() * (L - 80);
      const c = cellOf(x, y);
      if (state.grid[idx(c.x, c.y)] !== VOID) continue;
      const a = Math.random() * Math.PI * 2;
      state.orbs.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, speed });
      return;
    }
  }

  function setupLevel() {
    initGrid();
    state.orbs.length = 0;
    const speed = levelOrbSpeed(state.level);
    for (let i = 0; i < levelOrbCount(state.level); i++) spawnOrb(speed + i * 2);
    resetRound(false);
    state.overlayMsg = `LEVEL ${state.level}`;
    state.overlayT = 0.95;
  }

  function resetRound(loseScore) {
    for (let i = 0; i < GRID_SIZE; i++) if (state.grid[i] === TRAIL) state.grid[i] = VOID;
    state.trail.length = 0;
    state.trailSet.clear();
    state.player.x = CELL * 2.5;
    state.player.y = CELL * 2.5;
    state.player.dirX = 0;
    state.player.dirY = 0;
    state.player.inVoid = false;
    state.shock = null;
    state.shockTimer = 0;
    if (loseScore) {
      state.score = Math.max(0, state.score - 300);
      state.shakeAmp = Math.max(state.shakeAmp, 12);
    }
    state.redrawStatic = true;
  }

  function gameOver() {
    state.gameOver = true;
    const s = Math.floor(state.score);
    if (s > state.high) {
      state.high = s;
      localStorage.setItem('voltgrid-highscore', String(s));
    }
    el.overlay.innerHTML = `SYSTEM FAILURE<br>Score ${s}<br>Tap / Space to reboot`;
  }

  function restart() {
    state.level = 1;
    state.score = 0;
    state.gameOver = false;
    el.overlay.textContent = '';
    setupLevel();
  }

  function addTrail(cx, cy) {
    const key = cx * 1000 + cy;
    if (state.trailSet.has(key)) {
      resetRound(true);
      return;
    }
    state.trailSet.add(key);
    state.trail.push({ x: cx, y: cy });
    state.grid[idx(cx, cy)] = TRAIL;
    state.redrawStatic = true;
  }

  function claimedPercent() {
    let count = 0;
    for (let i = 0; i < GRID_SIZE; i++) if (state.grid[i] === CLAIMED) count++;
    return count / GRID_SIZE;
  }

  function finalizePath() {
    if (!state.trail.length) return;

    for (const p of state.trail) state.grid[idx(p.x, p.y)] = CLAIMED;

    const orbMask = new Uint8Array(GRID_SIZE);
    for (const o of state.orbs) {
      const c = cellOf(o.x, o.y);
      orbMask[idx(c.x, c.y)] = 1;
    }

    // Performance critical: flood-fill uses typed arrays and preallocated queue buffers.
    const visited = new Uint8Array(GRID_SIZE);
    const qx = new Int16Array(GRID_SIZE);
    const qy = new Int16Array(GRID_SIZE);
    let bestRegion = null;

    for (let sy = 1; sy < GH - 1; sy++) {
      for (let sx = 1; sx < GW - 1; sx++) {
        const start = idx(sx, sy);
        if (visited[start] || state.grid[start] !== VOID) continue;

        let head = 0, tail = 0;
        qx[tail] = sx;
        qy[tail] = sy;
        tail++;
        visited[start] = 1;

        const cells = [];
        let hasOrb = false;

        while (head < tail) {
          const x = qx[head];
          const y = qy[head];
          head++;
          const id = idx(x, y);
          cells.push(id);
          if (orbMask[id]) hasOrb = true;

          if (x > 0) {
            const n = idx(x - 1, y);
            if (!visited[n] && state.grid[n] === VOID) { visited[n] = 1; qx[tail] = x - 1; qy[tail] = y; tail++; }
          }
          if (x < GW - 1) {
            const n = idx(x + 1, y);
            if (!visited[n] && state.grid[n] === VOID) { visited[n] = 1; qx[tail] = x + 1; qy[tail] = y; tail++; }
          }
          if (y > 0) {
            const n = idx(x, y - 1);
            if (!visited[n] && state.grid[n] === VOID) { visited[n] = 1; qx[tail] = x; qy[tail] = y - 1; tail++; }
          }
          if (y < GH - 1) {
            const n = idx(x, y + 1);
            if (!visited[n] && state.grid[n] === VOID) { visited[n] = 1; qx[tail] = x; qy[tail] = y + 1; tail++; }
          }
        }

        if (!hasOrb && (!bestRegion || cells.length < bestRegion.length)) bestRegion = cells;
      }
    }

    const killMask = new Uint8Array(GRID_SIZE);
    if (bestRegion) {
      for (const id of bestRegion) {
        state.grid[id] = CLAIMED;
        killMask[id] = 1;
      }
      state.score += bestRegion.length * 2;
      state.redrawStatic = true;
    }

    // Containment kill + shake when orb trapped in completed shape.
    const before = state.orbs.length;
    state.orbs = state.orbs.filter(o => {
      const c = cellOf(o.x, o.y);
      return killMask[idx(c.x, c.y)] === 0;
    });
    const destroyed = before - state.orbs.length;
    if (destroyed > 0) {
      state.score += destroyed * 800;
      state.shakeAmp = Math.max(state.shakeAmp, 10);
      for (let i = 0; i < destroyed; i++) spawnOrb(levelOrbSpeed(state.level) + 6 * i);
    }

    state.trail.length = 0;
    state.trailSet.clear();
    state.shock = null;
    state.shockTimer = 0;

    const pct = claimedPercent();
    if (pct >= levelGoal(state.level)) {
      state.level++;
      state.score += 1200;
      setupLevel();
      return;
    }
  }

  function triggerShock(cx, cy) {
    if (!state.trail.length || state.shock) return;
    let best = 0;
    let bestD = Infinity;
    for (let i = 0; i < state.trail.length; i++) {
      const t = state.trail[i];
      const d = Math.abs(t.x - cx) + Math.abs(t.y - cy);
      if (d < bestD) { bestD = d; best = i; }
    }
    state.shock = { index: best, speed: PLAYER_SPEED * 1.15, x: 0, y: 0 };
    state.shockTimer = 2;
  }

  function updateShock(dt) {
    if (!state.shock) return;
    state.shockTimer = Math.max(0, state.shockTimer - dt);
    if (!state.player.inVoid || state.trail.length === 0) {
      state.shock = null;
      state.shockTimer = 0;
      return;
    }

    const pc = cellOf(state.player.x, state.player.y);
    let target = 0;
    let dBest = Infinity;
    for (let i = 0; i < state.trail.length; i++) {
      const t = state.trail[i];
      const d = Math.abs(t.x - pc.x) + Math.abs(t.y - pc.y);
      if (d < dBest) { dBest = d; target = i; }
    }

    const dir = Math.sign(target - state.shock.index) || 1;
    state.shock.index = clamp(state.shock.index + (dir * state.shock.speed * dt / CELL), 0, state.trail.length - 1);

    const i0 = state.shock.index | 0;
    const i1 = Math.min(state.trail.length - 1, i0 + 1);
    const f = state.shock.index - i0;
    const a = state.trail[i0];
    const b = state.trail[i1] || a;
    state.shock.x = ((a.x + (b.x - a.x) * f) + .5) * CELL;
    state.shock.y = ((a.y + (b.y - a.y) * f) + .5) * CELL;

    if (Math.hypot(state.shock.x - state.player.x, state.shock.y - state.player.y) < 14 || state.shockTimer <= 0) {
      resetRound(true);
    }
  }

  function pollInputDirection() {
    if (input.left) return { x: -1, y: 0 };
    if (input.right) return { x: 1, y: 0 };
    if (input.up) return { x: 0, y: -1 };
    if (input.down) return { x: 0, y: 1 };

    const ax = input.joyX;
    const ay = input.joyY;
    const m = Math.hypot(ax, ay);
    if (m < DEAD_ZONE) return { x: 0, y: 0 };

    // Snap-to-cardinal for precise 4-way movement.
    if (Math.abs(ax) >= Math.abs(ay)) return { x: Math.sign(ax), y: 0 };
    return { x: 0, y: Math.sign(ay) };
  }

  function updatePlayer(dt) {
    const d = pollInputDirection();
    if (d.x !== 0 || d.y !== 0) {
      state.player.dirX = d.x;
      state.player.dirY = d.y;
    }

    state.player.x = clamp(state.player.x + state.player.dirX * PLAYER_SPEED * dt, 0, L - 1);
    state.player.y = clamp(state.player.y + state.player.dirY * PLAYER_SPEED * dt, 0, L - 1);

    const c = cellOf(state.player.x, state.player.y);
    const cell = state.grid[idx(c.x, c.y)];

    if (cell === VOID || cell === TRAIL) {
      if (cell === VOID) addTrail(c.x, c.y);
      state.player.inVoid = true;
    } else if (cell === CLAIMED && state.player.inVoid) {
      finalizePath();
      state.player.inVoid = false;
    }

    emitTail(state.player.x, state.player.y);
  }

  function updateOrbs(dt) {
    for (const o of state.orbs) {
      let nx = o.x + o.vx * dt;
      let ny = o.y + o.vy * dt;

      const hitSolid = (x, y) => {
        const c = cellOf(x, y);
        return state.grid[idx(c.x, c.y)] === CLAIMED;
      };

      if (nx <= 0 || nx >= L - 1 || hitSolid(nx, o.y)) {
        o.vx = -o.vx;
        nx = o.x + o.vx * dt;
      }
      if (ny <= 0 || ny >= L - 1 || hitSolid(o.x, ny)) {
        o.vy = -o.vy;
        ny = o.y + o.vy * dt;
      }

      o.x = nx;
      o.y = ny;

      const c = cellOf(o.x, o.y);
      if (state.grid[idx(c.x, c.y)] === TRAIL) triggerShock(c.x, c.y);
      if (!state.player.inVoid && Math.hypot(o.x - state.player.x, o.y - state.player.y) < 13) {
        resetRound(true);
      }
    }

    if (state.score > 32000) gameOver();
  }

  function emitTail(x, y) {
    if (state.particles.length >= MAX_PARTICLES) state.particles.shift();
    state.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 20,
      life: 0.35 + Math.random() * 0.2,
      max: 0.55,
      size: 2 + Math.random() * 2
    });
  }

  function updateParticles(dt) {
    // Performance critical: in-place compact loop avoids per-frame filter allocations.
    let write = 0;
    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) continue;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.95;
      p.vy *= 0.95;
      state.particles[write++] = p;
    }
    state.particles.length = write;
  }

  function updateHUD() {
    const pct = (claimedPercent() * 100).toFixed(1);
    el.hud.level.textContent = `Level ${state.level}`;
    el.hud.claimed.textContent = `Claimed ${pct}%`;
    el.hud.score.textContent = `Score ${Math.floor(state.score)}`;
    el.hud.high.textContent = `High ${state.high}`;
    el.hud.timer.textContent = state.shockTimer > 0 ? `⚡ ${state.shockTimer.toFixed(1)}s` : '';
  }

  function drawStatic() {
    if (!state.redrawStatic) return;
    state.redrawStatic = false;

    sctx.fillStyle = '#050510';
    sctx.fillRect(0, 0, L, L);

    sctx.strokeStyle = 'rgba(90,120,255,.14)';
    sctx.lineWidth = 1;
    for (let x = 0; x <= L; x += CELL * 5) {
      sctx.beginPath(); sctx.moveTo(x, 0); sctx.lineTo(x, L); sctx.stroke();
    }
    for (let y = 0; y <= L; y += CELL * 5) {
      sctx.beginPath(); sctx.moveTo(0, y); sctx.lineTo(L, y); sctx.stroke();
    }

    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        const v = state.grid[idx(x, y)];
        if (v === VOID) continue;
        sctx.fillStyle = v === CLAIMED ? 'rgba(0,180,255,.28)' : 'rgba(255,59,100,.88)';
        sctx.fillRect(x * CELL, y * CELL, CELL + 0.4, CELL + 0.4);
      }
    }
  }

  function drawDynamic(ts) {
    dctx.clearRect(0, 0, L, L);

    if (state.shakeAmp > 0.05) {
      const sx = (Math.random() - 0.5) * state.shakeAmp;
      const sy = (Math.random() - 0.5) * state.shakeAmp;
      dctx.translate(sx, sy); // screen shake via translate with decay
      state.shakeAmp *= 0.88;
    }

    for (const o of state.orbs) {
      dctx.beginPath();
      dctx.fillStyle = '#ff40ff';
      dctx.shadowBlur = 14;
      dctx.shadowColor = '#ff40ff';
      dctx.arc(o.x, o.y, 8, 0, Math.PI * 2);
      dctx.fill();
      dctx.shadowBlur = 0;
    }

    if (state.shock) {
      const pulse = 8 + Math.sin(ts * 0.02) * 2;
      dctx.beginPath();
      dctx.fillStyle = '#ff3b64';
      dctx.shadowBlur = 18;
      dctx.shadowColor = '#ff3b64';
      dctx.arc(state.shock.x, state.shock.y, pulse, 0, Math.PI * 2);
      dctx.fill();
      dctx.shadowBlur = 0;
    }

    for (const p of state.particles) {
      const alpha = Math.max(0, p.life / p.max);
      dctx.fillStyle = `rgba(0,246,255,${alpha})`;
      dctx.beginPath();
      dctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      dctx.fill();
    }

    dctx.font = '30px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    dctx.textAlign = 'center';
    dctx.textBaseline = 'middle';
    dctx.shadowColor = '#00f6ff';
    dctx.shadowBlur = 18;
    dctx.fillText('👻', state.player.x, state.player.y);
    dctx.shadowBlur = 0;

    if (state.shakeAmp > 0.05) dctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function loop(ts) {
    loop.last ??= ts;
    const dt = Math.min(0.033, (ts - loop.last) / 1000);
    loop.last = ts;

    if (!state.gameOver) {
      updatePlayer(dt);
      updateOrbs(dt);
      updateShock(dt);
      updateParticles(dt);
      state.score += dt * (60 + state.level * 8);
      if (state.overlayT > 0) {
        state.overlayT -= dt;
        el.overlay.textContent = state.overlayMsg;
      } else if (!state.gameOver) {
        el.overlay.textContent = '';
      }
    }

    drawStatic();
    drawDynamic(ts);
    updateHUD();
    requestAnimationFrame(loop);
  }

  function resizeViewport() {
    const rect = el.arena.getBoundingClientRect();
    const scale = Math.max(0.2, Math.min(rect.width / L, rect.height / L));
    el.viewport.style.transform = `scale(${scale})`;
  }

  function setJoyKnob(x, y) {
    el.joy.style.setProperty('--jx', `${x}px`);
    el.joy.style.setProperty('--jy', `${y}px`);
  }

  function handleTouchStart(e) {
    if (state.gameOver) return restart();
    const t = e.changedTouches[0];
    input.touchId = t.identifier;
    input.cx = t.clientX;
    input.cy = t.clientY;
    el.joy.style.display = 'block';
    el.joy.style.left = `${t.clientX}px`;
    el.joy.style.top = `${t.clientY}px`;
    setJoyKnob(0, 0);
    e.preventDefault();
  }

  function handleTouchMove(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== input.touchId) continue;
      const dx = t.clientX - input.cx;
      const dy = t.clientY - input.cy;
      const dist = Math.hypot(dx, dy);
      const m = dist > 0 ? Math.min(JOY_RADIUS, dist) / dist : 0;
      const jx = dx * m;
      const jy = dy * m;
      setJoyKnob(jx, jy);
      input.joyX = jx / JOY_RADIUS;
      input.joyY = jy / JOY_RADIUS;
      e.preventDefault();
    }
  }

  function handleTouchEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== input.touchId) continue;
      input.touchId = null;
      input.joyX = 0;
      input.joyY = 0;
      el.joy.style.display = 'none';
      setJoyKnob(0, 0);
    }
  }

  function bindInput() {
    window.addEventListener('resize', resizeViewport);
    window.addEventListener('orientationchange', resizeViewport);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') input.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') input.down = true;
      if (e.code === 'Space' && state.gameOver) restart();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') input.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') input.down = false;
    });

    el.dynCanvas.addEventListener('pointerdown', () => {
      if (state.gameOver) restart();
    });

    // Low-latency touch handlers with passive: false to avoid scroll and delay.
    el.dynCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    el.dynCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    el.dynCanvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    el.dynCanvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });
  }

  bindInput();
  setupLevel();
  resizeViewport();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
